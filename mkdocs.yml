site_name: Wiki
site_description: Obsidian knowledge base rendered with MkDocs
site_url: http://localhost:8000/

# The `same-dir` plugin allows docs_dir to be the repo root (where this file
# lives), so no restructuring of the vault is required.
docs_dir: .

plugins:
  - same-dir
  - search
  # NOTE: obsidian-interactive-graph must run BEFORE roamlinks, otherwise
  # roamlinks rewrites the [[wikilinks]] first and the graph ends up empty.
  - obsidian-interactive-graph   # generates assets/javascripts/graph.json from wikilinks
  - roamlinks   # converts Obsidian [[wikilinks]] into MkDocs links

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.details
  - toc:
      permalink: true

# gitignore-style excludes (MkDocs 1.5+). Keeps Obsidian internals and
# archives out of the rendered site.
exclude_docs: |
  .archive/
  _archive/
  .obsidian/
  .git/
  templates/
  raw/
  schema/
  AGENTS.md
